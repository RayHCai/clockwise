[project]
name = "guidr-backend"
version = "0.1.0"
description = "Speech graph analysis and multimodal fusion for dementia screening"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "networkx>=3.3",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "google-genai>=1.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.8.0"]

[tool.setuptools]
py-modules = ["main", "speech_graph", "fusion", "conversation"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["main", "speech_graph", "fusion", "conversation"]
